[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node so Netlify doesn't drift to a version Vite 5 doesn't like.
  NODE_VERSION = "20"

# SPA fallback — without this, refreshing /merchant/... on Netlify 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Friendly hint when env is missing — the actual detection lives in
# src/lib/supabase/client.ts and logs to the browser console on boot.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in
# Site settings → Build & deploy → Environment, then trigger a fresh
# deploy (cached builds do NOT pick up env-var changes).
